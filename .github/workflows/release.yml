name: Release

on:
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py version
      - name: Install Rust and build tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config binutils
      - name: Check source
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build production binary
        run: cargo build --release --locked --target '${{ matrix.target }}'
      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: python3 scripts/release.py package
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Assemble catalog and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py catalog
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Upload everything to a draft before making the release visible.
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes "${flags[@]}"
          gh release upload "$RELEASE_TAG" dist/scoop-* dist/release-catalog.json dist/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
